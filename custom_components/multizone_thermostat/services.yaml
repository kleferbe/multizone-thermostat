reload:
  description: Reload all multizone_thermostat entities

#proportional
set_pwm_threshold:
  description: Set a new 'minimal_diff' before change switch
  fields:
    entity_id:
      description: Thermostat entity_id
      example: climate.study
    hvac_mode:
      description: hvac mode
      example: heat or cool
    new_threshold:
      description: minimum difference value of proportional controller
      example: 2

set_preset_mode:
  name: Set preset mode
  description: Set preset mode for climate device
  fields:
    entity_id:
      description: Thermostat entity_id
      example: climate.study
    hvac_mode:
      description: hvac mode
      example: heat or cool
    preset_mode:
      description: New value of preset mode
      example: "holiday"


# Describes the format for available PIDThermostat services
# PID
set_pid:
  description: Set a new Kp value
  fields:
    entity_id:
      description: Thermostat entity_id
      example: climate.study
    hvac_mode:
      description: hvac mode
      example: heat or cool
    kp:
      description: kp value of PID controller
      example: 2
    ki:
      description: kp value of PID controller
      example: 2
    kd:
      description: kp value of PID controller
      example: 2
    update:
      description: force values to controller
      example: true (default) or false


set_integral:
  description: Set a new integral value
  fields:
    entity_id:
      description: Thermostat entity_id
      example: climate.study
    hvac_mode:
      description: hvac mode
      example: heat or cool
    integral:
      description: integral value of PID controller
      example: 5

#weather mode
set_ka_kb:
  description: Set a new KA value
  fields:
    entity_id:
      description: Thermostat entity_id
      example: climate.study
    hvac_mode:
      description: hvac mode
      example: heat or cool
    ka:
      description: KA value of weather mode controller
      example: 8
    kb:
      description: KB value of weather mode controller
      example: 9

#filter mode
set_filter_mode:
  description: Set a new filter variable
  fields:
    entity_id:
      description: Thermostat entity_id
      example: climate.study
    mode:
      description: mode of filter (integral)
      example: 5

detailed_output:
  description: Include detailed output (PID, control output) in attributes
  fields:
    entity_id:
      description: Thermostat entity_id
      example: climate.study
    hvac_mode:
      description: hvac mode
      example: heat or cool
    new_mode:
      description: Include detailed output
      example: True or False

stuck_prevention:
  name: Stuck prevention (anti-calc)
  description: Check immediately whether valves need an anti-calc flush and run that plan if so. Does nothing when none qualify. On a climate entity this only runs while uncoordinated or standalone.
  fields:
    entity_id:
      description: Room climate to flush, or the circuit Select to start the coordinated sequence
      example: select.heizung_master
    force:
      description: Flush regardless of last valve change. On the circuit, include every satellite.
      example: true

